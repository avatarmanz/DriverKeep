# Builds the Linux command-line tool (linux/) and packages it as .tar.gz, .deb, .rpm and AppImage.
# NOT YET RUN: written on Windows, never executed. Expect to fix small things on the first run.
# The Windows app/installer is built separately with make-installer.cmd and is not touched here.
name: linux-release

on:
  push:
    tags: ["linux-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools imagemagick
          rustup target add x86_64-unknown-linux-musl
          cargo install cargo-deb cargo-generate-rpm --locked

      - name: Test
        working-directory: linux
        run: cargo test --locked

      - name: Build static binary (x86_64, musl)
        working-directory: linux
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Collect
        working-directory: linux
        run: |
          mkdir -p out
          # cargo-deb / generate-rpm look in target/release; point them at the musl build.
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/driverkeep-linux target/release/
          cp target/release/driverkeep-linux out/driverkeep-linux-x86_64
          file out/driverkeep-linux-x86_64
          tar -C out -czf out/driverkeep-linux-x86_64.tar.gz driverkeep-linux-x86_64

      - name: .deb
        working-directory: linux
        run: |
          cargo deb --no-build --no-strip -o out/
          ls out

      - name: .rpm
        working-directory: linux
        run: |
          cargo generate-rpm -o out/
          ls out

      - name: AppImage
        working-directory: linux
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/driverkeep-linux AppDir/usr/bin/
          convert "../assets/icon.ico[0]" -resize 256x256 AppDir/driverkeep-linux.png
          cat > AppDir/driverkeep-linux.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DriverKeep for Linux
          Exec=driverkeep-linux
          Icon=driverkeep-linux
          Categories=System;
          Terminal=true
          EOF
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/driverkeep-linux" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir out/driverkeep-linux-x86_64.AppImage

      - name: Checksums
        working-directory: linux/out
        run: |
          rm -f driverkeep-linux-x86_64
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: linux/out/*

  release:
    # Only on a tag push. Attaches the files to a GitHub release for that tag.
    if: startsWith(github.ref, 'refs/tags/linux-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" \
            --title "DriverKeep for Linux ${{ github.ref_name }}" \
            --notes "Early test build of the Linux command-line tool. Not yet verified on real Linux machines; please report problems as GitHub issues." \
            --prerelease
