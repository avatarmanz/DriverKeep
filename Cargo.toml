[package]
name = "driverkeep"
version = "1.0.23"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_UpdateAgent", "Win32_System_Restore", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Wmi", "Win32_System_Power", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security"] }
windows-core = "0.62"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
